<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}生产工作台{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="masthead">
  <h1>生产工作台</h1>
  <span class="sub">AI VIDEO AGENT · CALL SHEET</span>
  <nav>
    <a href="{{ url_for('index') }}" class="{{ 'on' if nav=='index' }}">剧集</a>
    <a href="{{ url_for('skills') }}" class="{{ 'on' if nav=='skills' }}">Skill</a>
    <a href="{{ url_for('directors') }}" class="{{ 'on' if nav=='directors' }}">导演</a>
    <a href="{{ url_for('settings') }}" class="{{ 'on' if nav=='settings' }}">密钥设置</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
