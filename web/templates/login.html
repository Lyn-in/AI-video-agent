<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 生产工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20x%3D%274%27%20y%3D%278%27%20width%3D%2724%27%20height%3D%2716%27%20rx%3D%272%27%20fill%3D%27none%27%20stroke%3D%27%23A8321E%27%20stroke-width%3D%273%27%20transform%3D%27rotate%28-7%2016%2016%29%27%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<main class="login">
  <div class="eyebrow">生产工作台</div>
  <h2>请输入口令</h2>
  {% if err %}<div class="err">{{ err }}</div>{% endif %}
  <form method="post">
    {{ csrf_input() }}
    <label>口令</label>
    <input type="password" name="password" autocomplete="current-password" autofocus required>
    <div class="actions"><button type="submit" class="primary">进入</button></div>
  </form>
  <p class="note">忘了口令：删掉项目下的 <code>config/auth.json</code>，
  重新启动就不再要求登录。</p>
</main>
</body>
</html>
